name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=custom_components.alpha_ess --cov-fail-under=95

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Force the release branch onto the tested commit
        run: git checkout -B ${{ github.ref_name }} ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Create the next release from the Conventional Commits
        run: uvx --from python-semantic-release==10.7.0 semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
