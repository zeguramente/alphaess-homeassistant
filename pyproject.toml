[project]
name = "alpha-ess-homeassistant"
version = "0.1.0"
description = "Home Assistant integration for AlphaESS energy storage systems."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.373",
    "alphaess-aio==1.0.1",
    "mypy==2.3.1",
    "ruff==0.16.8",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["custom_components.alpha_ess"]
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"

